  <header class="topbar">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.name | escape }}</a>
    <nav aria-label="Main navigation">
      {% for link in site.data.navigation.main %}
      <a href="{{ link.url | relative_url }}">{{ link.title }}</a>
      {% endfor %}
    </nav>
  </header>
