<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url == "/" %}{{ site.title | escape }} — Research &amp; Teaching{% else %}{{ page.title | escape }} — {{ site.name | escape }}{% endif %}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/scrolling.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="stylesheet" href="{{ '/assets/css/universities.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="stylesheet" href="{{ "/assets/css/teaching.css" | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="stylesheet" href="{{ '/assets/css/site-theme.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script src="{{ '/assets/js/scrolling.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</head>
